<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Vin Perception Hackathon · Mô phỏng 3D Vòng kín BEV, IMU & Kalman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Spectral:ital,wght@0,500;1,500&display=swap">
  <style>
  /* Layout: one-screen app matching Day 12 Lab ("Phòng phát lại").
     The 3D street fills the viewport; a control & analysis rail floats left; a transport bar floats bottom;
     a HUD + Live 2D Pinhole Camera PiP floats top-right. */
  :root {
    --bg: #e8ecf0; --panel: rgba(250, 251, 252, .92); --panel-solid: #fafbfc; --ink: #17202b; --ink-2: #485364; --ink-3: #788395;
    --line: #d3d9e1; --chip: #e3e8ee; --focus: #1f8fb5;
    --blue: #1f6fa5; --teal: #138a74; --purple: #7b58a6; --gold: #b7750c; --green: #3f8f2a; --grey: #8a929c; --hit: #e2580f; --amber: #c99400; --ego: #c8343a;
    --sc-bg: #e3e8ed; --sc-ground: #d3dae0; --sc-road: #9ea8b3; --sc-mark: #fbfcfd; --sc-walk: #e2e7ec; --sc-yel: #d9a81c;
    --sc-bldg: #eef1f4; --sc-bldg2: #d9e0e7; --sc-edge: #97a3b1; --sc-glass: #a8c6da; --sc-tree: #a9c39a; --sc-trunk: #9a8d80;
    --sc-sky: #f4f7fa; --sc-gnd-light: #c9cfd6; --sc-cab: #4b5867; --sc-wheel: #2b323b; --sc-off: #59636f;
    --car-1: #9fb3c8; --car-2: #c4cdd6; --car-3: #8e99a6; --car-4: #b7c3cf; --car-dark: #2d343d; --bus: #2e548a; --adv: #7b58a6; --ped: #cf7f12;
    --scan: #1f6fa5; --scan-live: #e0a400; --plan: #138a74;
    --f-display: "Spectral", "Iowan Old Style", Georgia, serif;
    --f-ui: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0e1116; --panel: rgba(18, 22, 28, .92); --panel-solid: #12161c; --ink: #ece9e3; --ink-2: #b4b2ab; --ink-3: #8d8b85;
    --line: #2a3039; --chip: #1f252d; --focus: #58c4dd;
    --blue: #58c4dd; --teal: #5cd0b3; --purple: #a98bd0; --gold: #f0ac5f; --green: #83c167; --grey: #888c94; --hit: #ff8a3d; --amber: #f7d96f; --ego: #ff5a5f;
    --sc-bg: #0d1015; --sc-ground: #13171c; --sc-road: #1f242b; --sc-mark: #aab0b8; --sc-walk: #1a1f25; --sc-yel: #b68a1a;
    --sc-bldg: #1a1f26; --sc-bldg2: #20262e; --sc-edge: #3c6878; --sc-glass: #23404f; --sc-tree: #2c4a35; --sc-trunk: #3a332c;
    --sc-sky: #33404e; --sc-gnd-light: #0b0d10; --sc-cab: #11161c; --sc-wheel: #08090b; --sc-off: #2a3038;
    --car-1: #4c5d70; --car-2: #5d6773; --car-3: #3f4955; --car-4: #687380; --car-dark: #0f1216; --bus: #3d5f7f; --adv: #a98bd0; --ped: #f0ac5f;
    --scan: #58c4dd; --scan-live: #f7d96f; --plan: #5cd0b3;
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #0e1116; --panel: rgba(18, 22, 28, .92); --panel-solid: #12161c; --ink: #ece9e3; --ink-2: #b4b2ab; --ink-3: #8d8b85;
    --line: #2a3039; --chip: #1f252d; --focus: #58c4dd;
    --blue: #58c4dd; --teal: #5cd0b3; --purple: #a98bd0; --gold: #f0ac5f; --green: #83c167; --grey: #888c94; --hit: #ff8a3d; --amber: #f7d96f; --ego: #ff5a5f;
    --sc-bg: #0d1015; --sc-ground: #13171c; --sc-road: #1f242b; --sc-mark: #aab0b8; --sc-walk: #1a1f25; --sc-yel: #b68a1a;
    --sc-bldg: #1a1f26; --sc-bldg2: #20262e; --sc-edge: #3c6878; --sc-glass: #23404f; --sc-tree: #2c4a35; --sc-trunk: #3a332c;
    --sc-sky: #33404e; --sc-gnd-light: #0b0d10; --sc-cab: #11161c; --sc-wheel: #08090b; --sc-off: #2a3038;
    --car-1: #4c5d70; --car-2: #5d6773; --car-3: #3f4955; --car-4: #687380; --car-dark: #0f1216; --bus: #3d5f7f; --adv: #a98bd0; --ped: #f0ac5f;
    --scan: #58c4dd; --scan-live: #f7d96f; --plan: #5cd0b3;
    color-scheme: dark;
  }

  html, body { height: 100%; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui); overflow: hidden; }
  * { box-sizing: border-box; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .c-ego { color: var(--ego); } .c-blue { color: var(--blue); } .c-teal { color: var(--teal); } .c-purple { color: var(--purple); }
  .c-hit { color: var(--hit); } .c-gold { color: var(--gold); } .c-green { color: var(--green); } .c-grey { color: var(--grey); } .c-amber { color: var(--amber); }
  .k { font-family: var(--f-mono); font-size: .88em; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--chip); }

  .app { position: relative; height: 100%; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font: 600 11px/1.2 var(--f-mono); letter-spacing: .02em;
    padding: 3px 7px; border-radius: 5px; background: var(--panel-solid); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .lbl.ego { border-color: var(--ego); color: var(--ego); }
  .lbl.hit { border-color: var(--hit); color: var(--hit); font-size: 12px; }
  .lbl.plan { border-color: var(--teal); color: var(--teal); }
  .lbl.err { border-color: var(--hit); color: #fff; background: #c8343a; font-size: 12px; }
  .lbl.state { border-color: var(--purple); color: var(--purple); }

  /* Left Control Rail */
  .rail { position: absolute; left: 16px; top: 16px; bottom: 88px; width: min(440px, calc(100% - 32px)); display: flex; flex-direction: column;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; z-index: 3; }
  .rail-head { padding: 14px 20px 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; border-bottom: 1px solid var(--line); }
  .brand { font: italic 500 24px/1.15 var(--f-display); letter-spacing: -.01em; }
  .brand-sub { grid-column: 1 / -1; color: var(--ink-2); font-size: 12.5px; }
  .theme-btn { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); cursor: pointer; }
  .theme-btn span { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
  :root:not([data-theme="dark"]) .theme-btn [data-v="light"], :root[data-theme="dark"] .theme-btn [data-v="dark"] { background: var(--panel-solid); color: var(--ink); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) .theme-btn [data-v="light"] { background: none; color: var(--ink-3); }
    :root:not([data-theme]) .theme-btn [data-v="dark"] { background: var(--panel-solid); color: var(--ink); } }

  .body { padding: 14px 20px 18px; overflow-y: auto; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 11px; }
  .body > * { flex-shrink: 0; }
  .eyebrow { font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .body h2 { margin: 0; font: italic 500 21px/1.22 var(--f-display); text-wrap: balance; }
  .body p { margin: 0; color: var(--ink-2); max-width: 62ch; font-size: 13.8px; }
  .body p b { color: var(--ink); font-weight: 600; }
  .try { font-size: 13px; border-left: 2px solid var(--ego); padding-left: 10px; color: var(--ink-2); }
  .try b { color: var(--ego); }

  .ctl { display: flex; flex-direction: column; gap: 8px; }
  .sl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 13px; }
  .sl output { font: 600 12.5px var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
  .sl input { grid-column: 1 / -1; width: 100%; accent-color: var(--ego); }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; align-self: flex-start; }
  .seg button { border: 0; background: none; padding: 6px 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel-solid); }
  .lab { font: 600 10.5px var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-top: 2px; }
  .read { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; padding: 10px 12px; background: var(--chip); border-radius: 10px; }
  .read b { font: 600 12.5px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
  .read .h { grid-column: 1 / -1; font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
  .plot { width: 100%; height: auto; aspect-ratio: 380 / 195; background: var(--chip); border-radius: 10px; display: block; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th { font: 600 10px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .tbl td { padding: 5px 6px; text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: 12px; border-bottom: 1px solid var(--line); }
  .tbl td:first-child { font-family: var(--f-ui); font-weight: 600; font-size: 12.5px; }
  .tbl tr.sel td { background: var(--chip); }
  .insight { font-size: 13px; line-height: 1.52; padding: 10px 12px; border-left: 3px solid var(--teal); background: var(--chip); border-radius: 0 10px 10px 0; color: var(--ink-2); }
  .insight b { color: var(--ink); }

  /* Right HUD & Live Pinhole Camera PiP */
  .right-stack { position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: none; z-index: 3; }
  .hud { display: flex; gap: 8px; align-items: stretch; }
  .hud > div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .hud .v { font: 600 20px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
  .hud .u { font: 600 10px var(--f-mono); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
  .hud .mode { font: 600 12px var(--f-ui); color: var(--ink-2); max-width: 240px; display: flex; align-items: center; }
  .hud .mode b { color: var(--ego); margin-right: 4px; }

  .pip-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .pip-card canvas { display: block; width: 290px; height: 160px; border-radius: 8px; border: 1px solid var(--line); }

  /* Transport Bar */
  .bar { position: absolute; left: 472px; right: 16px; bottom: 16px; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; z-index: 3; }
  .bar .play { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--ink); color: var(--panel-solid); cursor: pointer; font-size: 14px; flex: none; }
  .bar .tbtn { border: 1px solid var(--line); background: none; border-radius: 8px; height: 32px; padding: 0 10px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink-2); flex: none; }
  .scrub { flex: 1 1 auto; min-width: 60px; position: relative; height: 34px; display: flex; align-items: center; }
  .scrub input { width: 100%; accent-color: var(--ego); position: relative; z-index: 1; }
  .scrub .ticks { position: absolute; left: 8px; right: 8px; top: 0; height: 9px; pointer-events: none; }
  .scrub .ticks i { position: absolute; top: 0; width: 2px; height: 9px; border-radius: 1px; transform: translateX(-1px); }
  .tread { font: 600 13px var(--f-mono); font-variant-numeric: tabular-nums; min-width: 60px; text-align: right; flex: none; }
  .toast { position: absolute; left: 55%; top: 84px; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
    background: var(--panel-solid); border: 1px solid var(--hit); color: var(--hit); max-width: min(560px, 70%); text-align: center; z-index: 5; box-shadow: 0 4px 16px rgba(0,0,0,.2); }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100%; display: flex; flex-direction: column; }
    #stage { position: relative; height: 56vh; min-height: 320px; flex: none; order: 1; }
    .right-stack { top: 10px; right: 10px; transform: scale(.82); transform-origin: top right; }
    .hud .mode { display: none; }
    .bar { position: relative; left: auto; right: auto; bottom: auto; margin: 10px 16px 0; height: 52px; order: 2; }
    .rail { position: relative; left: auto; top: auto; bottom: auto; width: auto; margin: 10px 16px 16px; order: 3; }
    .body { overflow: visible; }
  }
  </style>
</head>
<body>

<div class="app" id="app">
  <div id="stage" aria-label="Mô phỏng 3D: đoạn phố VinFast & VinBus, kéo chuột để xoay góc nhìn 3D, cuộn chuột để phóng to/thu nhỏ.">
    <div id="labels"></div>
  </div>

  <div class="right-stack" aria-live="off">
    <div class="hud">
      <div><div class="v" id="hudV">0</div><div class="u">km/h · xe ta</div></div>
      <div><div class="v" id="hudPitch">+0,0°</div><div class="u">IMU Pitch</div></div>
      <div class="mode" id="hudMode">VinPerception</div>
    </div>
    <div class="pip-card">
      <canvas id="pipCam" width="320" height="176"></canvas>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <aside class="rail" aria-label="Bảng điều khiển & Phân tích">
    <div class="rail-head">
      <div class="brand">Vin Perception Hackathon</div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Đổi nền sáng hoặc tối">
        <span data-v="light">Sáng</span><span data-v="dark">Tối</span>
      </button>
      <div class="brand-sub">Mô phỏng 3D Vòng kín: Camera Pinhole 2D → Bù góc nghiêng IMU BEV → Lọc Kalman & Vòng Elip Bất định → Phanh tự động AEB.</div>
    </div>
    <div class="body" id="body"></div>
  </aside>

  <div class="bar" role="group" aria-label="Điều khiển thời gian">
    <button class="play" id="play" type="button" aria-label="Chạy hoặc dừng">❚❚</button>
    <button class="tbtn" id="restart" type="button" aria-label="Chạy lại từ đầu">↺</button>
    <button class="tbtn" id="speed" type="button" aria-label="Tốc độ phát">1×</button>
    <div class="scrub">
      <div class="ticks" id="ticks"></div>
      <input id="time" type="range" min="0" max="18" step="0.05" value="0" aria-label="Thời gian mô phỏng">
    </div>
    <div class="tread" id="tread">0,0 s</div>
    <button class="tbtn cam" id="camBtn" type="button">theo xe</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="vin_sim.js"></script>
<script src="vin_app.js"></script>

</body>
</html>
